# Preview check — runs on every branch except master.
#  1. Installs dependencies (and commits an updated package-lock.json if needed)
#  2. Builds the site exactly like the host does (npm run build)
#  3. Starts it and takes phone + desktop screenshots of the main pages,
#     published to the "ci-screenshots" branch so changes can be reviewed.
name: Preview check

on:
  push:
    branches-ignore: [master, ci-screenshots]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Commit updated package-lock.json
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "Iris Tours Bot"
            git config user.email "bot@iristours.net"
            git add package-lock.json
            git commit -m "chore: update package-lock.json [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev || true

      - name: Security audit (all dependencies)
        run: npm audit || true

      - name: Build
        run: npm run build

      - name: Start site
        run: |
          npm run start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done

      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: Take screenshots
        run: node .github/scripts/screenshots.mjs

      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          cp server.log shots/ || true
          cd shots
          git init -q
          git checkout -q -b ci-screenshots
          git config user.name "Iris Tours Bot"
          git config user.email "bot@iristours.net"
          echo "${{ github.ref_name }} @ ${{ github.sha }}" > SOURCE.txt
          git add -A
          git commit -q -m "Screenshots for ${{ github.ref_name }} @ ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
